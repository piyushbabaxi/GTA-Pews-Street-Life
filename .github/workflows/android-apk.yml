name: Build GTA Pews APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Godot
        run: godot --version

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/GTA-Pews-Street-Life.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA-Pews-Street-Life-APK
          path: build/GTA-Pews-Street-Life.apk
          if-no-files-found: error
          
